workflows:
  main:
    jobs:
      - lint
      - test-linux:
          matrix:
            parameters:
              python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
      - test:
          matrix:
            parameters:
              os: [macos, windows]
              # FIXME: upgrade to 3.15. blocked by https://github.com/circleci-functions/setup-python/issues/39
              python-version: ["3.14"]
      - success:
          requires:
            - lint
            - test-linux
            - test
