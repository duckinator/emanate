version: "2.1"

functions:
  setup-python: github.com/circleci-functions/setup-python@v0.5.0

executors:
  macos:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
  windows:
    resource_class: "windows.medium"
    machine:
      image: "windows-server-2022-gui:current"
      shell: "powershell.exe -ExecutionPolicy Bypass"

jobs:
  lint:
    docker:
      - image: cimg/python:3.15
    steps:
      - checkout
      - run:
          name: install
          command: pip install -e .[lint]
      - run:
          name: lint
          command: bork run lint

  test-linux:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Python version
          command: python3 --version
      - run:
          name: install
          command: pip install -e .[test]
      - run:
          name: test
          command: python3 -m pytest --verbose

  test:
    parameters:
      os:
        type: executor
      python-version:
        type: string
    executor: << parameters.os >>
    steps:
      - checkout
      - setup-python:
          with:
            python-version: << parameters.python-version >>
      - run:
          name: Python version
          command: python3 --version
      - run:
          name: install
          command: pip install -e .[test]
      - run:
          name: test
          command: python3 -m pytest --verbose

  success:
    type: no-op

